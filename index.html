<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f5ee">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mealio">
  <title>Mealio — Recipes & Grocery Checklist</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#f8f5ee}body{overflow:hidden}iframe{border:0;width:100%;height:100%;display:block;background:#f8f5ee}
    #gather-auth{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:#f8f5ee;color:#202521;font-family:Arial,sans-serif}
    #gather-auth[hidden]{display:none}
    #gather-auth-card{width:min(380px,calc(100vw - 32px));background:#fffdf8;border:1px solid #e5e1d8;padding:28px;box-shadow:0 20px 70px #0002}
    #gather-auth-card h1{font-family:Georgia,serif;font-size:36px;line-height:1;margin:0 0 8px}
    #gather-auth-card h1 em{color:#e36331}
    #gather-auth-card p{color:#70756f;font-size:13px;line-height:1.5}
    #gather-auth-card label{display:block;font-size:11px;margin:16px 0 6px;color:#46604c}
    #gather-auth-card input{width:100%;padding:11px;border:1px solid #dcd9d0;background:white;font-size:14px}
    #gather-auth-card button{margin-top:18px;width:100%;border:0;background:#202521;color:white;padding:12px;font-weight:600;cursor:pointer}
    #gather-auth-status{min-height:18px;color:#b33;font-size:12px;margin-top:10px}#gather-auth-loading{font:600 16px Arial,sans-serif;color:#46604c}
  </style>
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
  <div id="gather-auth">
    <div id="gather-auth-loading" role="status" aria-live="polite">Loading Mealio…</div>
    <form id="gather-auth-card" hidden>
      <h1>Good food,<br><em>made simple.</em></h1>
      <p>Sign in to access your Mealio grocery list and recipes.</p>
      <label for="gather-email">Email</label>
      <input id="gather-email" type="email" autocomplete="email" required>
      <label for="gather-password">Password</label>
      <input id="gather-password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
      <div id="gather-auth-status" aria-live="polite"></div>
    </form>
  </div>
  <iframe id="app" title="Gather recipes and grocery checklist" src="grocery.html"></iframe>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (() => {
      const SUPABASE_URL = 'https://bxqzzilkfdkndbwzavsi.supabase.co';
      const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_6HU9u-7fO5PsfjEhcOnDFg_rKswZ-7i';
      const { createClient } = window.supabase;
      const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
      const app = document.querySelector('#app');
      const auth = document.querySelector('#gather-auth');
      const authForm = document.querySelector('#gather-auth-card');
      const authStatus = document.querySelector('#gather-auth-status');
      const authLoading = document.querySelector('#gather-auth-loading');
      let session = null, appReady = false, appSyncPromise = null, groceryItems = [], recipes = [], checklist = new Set(), recipeByTitle = new Map(), itemById = new Map(), itemByPath = new Map(), itemQuantities = new Map();
      const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
      function frameDoc(){ return app.contentDocument; }
      function showAuth(message=''){ auth.hidden=false; authLoading.hidden=true; authForm.hidden=false; authStatus.textContent=message; }
      function showLoading(message='Loading Mealio…'){ auth.hidden=false; authForm.hidden=true; authLoading.hidden=false; authLoading.textContent=message; }
      function hideAuth(){ auth.hidden=true; authStatus.textContent=''; }
      function showSaveError(message='Couldn’t save your change. Please try again.'){const doc=frameDoc();if(!doc)return;let notice=doc.querySelector('#gather-save-error');if(!notice){notice=doc.createElement('div');notice.id='gather-save-error';notice.setAttribute('role','status');notice.setAttribute('aria-live','polite');notice.style.cssText='position:fixed;left:16px;right:16px;bottom:16px;z-index:10000;padding:12px 14px;border-radius:6px;background:#202521;color:#fffdf8;font:13px Arial,sans-serif;box-shadow:0 8px 24px #0004';doc.body.append(notice);}notice.textContent=message;clearTimeout(showSaveError.timer);showSaveError.timer=setTimeout(()=>notice.remove(),5000);}
      async function signIn(email,password){ const {data,error}=await supabase.auth.signInWithPassword({email,password}); if(error) throw error; session=data.session; await prepareApp(); }
      authForm.addEventListener('submit',async event=>{ event.preventDefault(); authStatus.textContent='Signing in…'; try{ await signIn(document.querySelector('#gather-email').value.trim(),document.querySelector('#gather-password').value); }catch(error){ authStatus.textContent=error.message||'Unable to sign in.'; } });
      async function loadDatabase(){
        const results=await Promise.all([
          supabase.from('grocery_stores').select('id,name,sort_order').eq('user_id',session.user.id).order('sort_order'),
          supabase.from('grocery_items').select('id,store_id,name,parent_id,sort_order,active,section_name,price,tax,notes').eq('user_id',session.user.id).eq('active',true).order('sort_order'),
          supabase.from('recipes').select('id,title,type,time,description,emoji,sort_order,active').eq('user_id',session.user.id).eq('active',true).order('sort_order'),
          supabase.from('recipe_groups').select('id,recipe_id,name,sort_order').order('sort_order'),
          supabase.from('recipe_ingredients').select('id,recipe_id,group_id,grocery_item_id,quantity,ingredient_text,sort_order').order('sort_order'),
          supabase.from('recipe_steps').select('id,recipe_id,step_number,instruction').order('step_number'),
          supabase.from('grocery_checklist').select('grocery_item_id,checked,quantity').eq('user_id',session.user.id)
        ]);
        results.forEach(result=>{if(result.error) throw result.error;});
        const stores=results[0].data||[]; groceryItems=results[1].data||[]; itemById=new Map(groceryItems.map(item=>[item.id,item]));
        const storeById=new Map(stores.map(store=>[store.id,store.name])); itemByPath=new Map();
        const pathFor=item=>{const parts=[storeById.get(item.store_id)||''];const parents=[];let current=item;while(current?.parent_id){current=itemById.get(current.parent_id);if(!current)break;parents.unshift(current.name);}if(item.section_name)parts.push(item.section_name);parts.push(...parents,item.name);return parts.filter(Boolean).join(' / ');};
        groceryItems.forEach(item=>itemByPath.set(pathFor(item),item.id));
        const groups=results[3].data||[],ingredients=results[4].data||[],steps=results[5].data||[],groupsByRecipe=new Map();
        groups.forEach(group=>{if(!groupsByRecipe.has(group.recipe_id))groupsByRecipe.set(group.recipe_id,[]);groupsByRecipe.get(group.recipe_id).push({...group,ingredients:ingredients.filter(i=>i.group_id===group.id)});});
        recipes=(results[2].data||[]).map(recipe=>({...recipe,groups:(groupsByRecipe.get(recipe.id)||[]).sort((a,b)=>a.sort_order-b.sort_order),steps:steps.filter(step=>step.recipe_id===recipe.id).sort((a,b)=>a.step_number-b.step_number)}));
        recipeByTitle=new Map(recipes.map(recipe=>[recipe.title,recipe]));
        checklist=new Set((results[6].data||[]).filter(row=>row.checked).map(row=>row.grocery_item_id));
        itemQuantities = new Map(
  (results[6].data || [])
    .map(row => [row.grocery_item_id, Number(row.quantity) || 1])
);
      }
      function updateEstimatedBill(doc){
  const totalElement=doc.querySelector('#estimated-grocery-total');
  if(!totalElement)return;

  let total=0;

  groceryItems.forEach(item=>{
    if(!checklist.has(item.id))return;

    const price=Number(item.price);
    if(!Number.isFinite(price))return;

    const quantity=Number(itemQuantities.get(item.id)||1);
    const taxable=String(item.tax??'').trim().toUpperCase()==='Y';

    const itemTotal=price*quantity*(taxable?1.0825:1);
    total+=itemTotal;
  });

  totalElement.textContent=`$${total.toFixed(2)}`;
}
      
      function buildMasterList(doc){
        const list=doc.querySelector('#master-list'); if(!list)return;
        const children=new Map(); groceryItems.forEach(item=>{if(!children.has(item.parent_id||0))children.set(item.parent_id||0,[]);children.get(item.parent_id||0).push(item);});
        const storeNames=new Map(); groceryItems.forEach(item=>{const path=[...itemByPath.entries()].find(([,id])=>id===item.id)?.[0];const storeName=path?.split(' / ')[0];if(storeName)storeNames.set(item.store_id,storeName);});
        const row=item=>{
  const li=doc.createElement('li');
  const label=doc.createElement('label');
  const input=doc.createElement('input');
  const span=doc.createElement('span');
  const infoButton=doc.createElement('button');

  li.className='grocery-item-row';

  input.type='checkbox';
  input.dataset.dbId=item.id;
  input.dataset.id=[...itemByPath.entries()].find(([,id])=>id===item.id)?.[0]||String(item.id);
  input.checked=checklist.has(item.id);

  span.textContent=item.name;

  infoButton.type='button';
  infoButton.className='grocery-info-button';
  infoButton.textContent='ⓘ';
  infoButton.setAttribute('aria-label',`View information for ${item.name}`);
  infoButton.dataset.groceryInfoId=item.id;

  label.append(input,span);
  li.append(label,infoButton);

  if(input.checked)li.classList.add('checked');

  input.addEventListener('change',()=>setChecked(item.id,input.checked));

  if(!itemQuantities.has(item.id)){
    itemQuantities.set(item.id,1);
  }

  const nested=(children.get(item.id)||[]).sort((a,b)=>a.sort_order-b.sort_order);

  if(nested.length){
    const ul=doc.createElement('ul');
    ul.className='master-children';
    nested.forEach(child=>ul.append(row(child)));
    li.append(ul);
  }

  return li;
};
        function showGroceryInfo(itemId){
  const item=itemById.get(Number(itemId));
  if(!item)return;

  if(!itemQuantities.has(item.id)){
    itemQuantities.set(item.id,1);
  }

  const quantity=itemQuantities.get(item.id);

  const overlay=doc.createElement('div');
  overlay.className='grocery-info-overlay';

  const modal=doc.createElement('div');
  modal.className='grocery-info-modal';

  const priceText=item.price==null||item.price===''?'Not available':`$${Number(item.price).toFixed(2)}`;
  const notesText=item.notes==null||item.notes.trim()===''?'No notes for this item.':item.notes;

  modal.innerHTML=`
    <div class="grocery-info-header">
      <h3>${esc(item.name)}</h3>
      <button type="button" class="grocery-info-close" aria-label="Close">×</button>
    </div>

    <div class="grocery-info-content">
      <div class="grocery-info-field">
        <div class="grocery-info-label">PRICE</div>
        <div class="grocery-info-value">${priceText}</div>
      </div>

      <div class="grocery-info-field">
        <div class="grocery-info-label">NOTES</div>
        <div class="grocery-info-value">${esc(notesText)}</div>
      </div>

      <div class="grocery-info-field">
        <label class="grocery-info-label" for="grocery-quantity-${item.id}">QUANTITY</label>
        <select id="grocery-quantity-${item.id}" class="grocery-quantity">
          ${Array.from({length:10},(_,index)=>{
            const value=index+1;
            return `<option value="${value}" ${value===quantity?'selected':''}>${value}</option>`;
          }).join('')}
        </select>
      </div>
    </div>
  `;

  overlay.append(modal);
  doc.body.append(overlay);

  const close=()=>{
    overlay.remove();
  };

  modal.querySelector('.grocery-info-close').addEventListener('click',close);

  overlay.addEventListener('click',event=>{
    if(event.target===overlay)close();
  });

const quantitySelect=modal.querySelector('.grocery-quantity');

quantitySelect.addEventListener('change',async ()=>{
  const previousQuantity=itemQuantities.get(item.id)||1;
  const quantity=Number(quantitySelect.value)||1;

  itemQuantities.set(item.id,quantity);

  const {error}=await supabase
    .from('grocery_checklist')
    .upsert({
      user_id:session.user.id,
      grocery_item_id:item.id,
      checked:checklist.has(item.id),
      quantity,
      updated_at:new Date().toISOString()
    },{onConflict:'user_id,grocery_item_id'});

  if(error){
    console.error('Quantity update failed:',error);
    itemQuantities.set(item.id,previousQuantity);
    quantitySelect.value=String(previousQuantity);
    showSaveError();
    return;
  }

  updateEstimatedBill(doc);
});
}
if(!list.dataset.infoWired){
  list.dataset.infoWired='1';

  list.addEventListener('click',event=>{
    const infoButton=event.target.closest('.grocery-info-button');

    if(infoButton){
      event.preventDefault();
      event.stopPropagation();
      showGroceryInfo(infoButton.dataset.groceryInfoId);
    }
  });
}
        list.innerHTML=''; const stores=new Map(); groceryItems.forEach(item=>{if(!stores.has(item.store_id))stores.set(item.store_id,[]);stores.get(item.store_id).push(item);});
        [...stores.keys()].sort((a,b)=>{
          const an=storeNames.get(a)||'';
          const bn=storeNames.get(b)||'';
          const order={Walmart:0,Costco:1};
          return (order[an]??99)-(order[bn]??99)||an.localeCompare(bn);
        }).forEach(storeId=>{
          const title=doc.createElement('li');
          title.className='master-section';
          title.textContent=storeNames.get(storeId)||'Store';
          list.append(title);

          const storeItems=(children.get(0)||[])
            .filter(item=>item.store_id===storeId)
            .sort((a,b)=>a.sort_order-b.sort_order);

          let currentSection=null;

          storeItems.forEach(item=>{
            const section=item.section_name||null;

            if(section!==currentSection){
              if(section){
                const sectionTitle=doc.createElement('li');
                sectionTitle.className='master-subsection';
                sectionTitle.textContent=section;
                list.append(sectionTitle);
              }

              currentSection=section;
            }

            list.append(row(item));
          });
        });

        updateEstimatedBill(doc);
      }

function updateEstimatedBill(doc){
  const totalElement = doc.querySelector('#estimated-grocery-total');
  if(!totalElement) return;

  let total = 0;

  groceryItems.forEach(item => {
    if(!checklist.has(item.id)) return;
    if(item.price === null || item.price === undefined || item.price === '') return;

    const price = Number(item.price);
    if(!Number.isFinite(price)) return;

    const quantity = itemQuantities.get(item.id) || 1;
    const taxable = String(item.tax || '').trim().toUpperCase() === 'Y';

    const itemTotal = price * quantity * (taxable ? 1.0825 : 1);

    total += itemTotal;
  });

  totalElement.textContent = `$${total.toFixed(2)}`;
}

async function setChecked(itemId,checked){
  const wasChecked=checklist.has(itemId);

  if(checked) {
    checklist.add(itemId);
    if(!itemQuantities.has(itemId)) itemQuantities.set(itemId,1);
  } else {
    checklist.delete(itemId);
  }

  buildMasterList(frameDoc());

  const result = await supabase
    .from('grocery_checklist')
    .upsert({
      user_id:session.user.id,
      grocery_item_id:itemId,
      checked,
      quantity:Number(itemQuantities.get(itemId)) || 1,
      updated_at:new Date().toISOString()
    },{onConflict:'user_id,grocery_item_id'});

  if(result.error){
    console.error('Checklist sync failed:',result.error);
    if(wasChecked) checklist.add(itemId); else checklist.delete(itemId);
    buildMasterList(frameDoc());
    showSaveError();
  }
}
      async function clearChecks(){const {error}=await supabase.from('grocery_checklist').update({checked:false,updated_at:new Date().toISOString()}).eq('user_id',session.user.id).eq('checked',true);if(error){console.error('Clear checklist failed:',error);showSaveError();return;}checklist.clear();buildMasterList(frameDoc());}
      function ensureFrameStructure(doc){const root=doc.querySelector('#gather-recipes');if(!root)return;let extra=doc.querySelector('#gr-extra');if(!extra){extra=doc.createElement('div');extra.id='gr-extra';}root.prepend(extra);extra.innerHTML='<nav class="gr-nav"><button class="active" id="gr-show-list">Grocery Checklist</button><button id="gr-show-recipes">Recipes</button></nav><section class="master-view"><div class="master-head"><div><p class="eyebrow">MASTER SHOPPING LIST</p><h2>Grocery Checklist</h2><p>Items stay unchecked until you select them or add a recipe.</p></div><div class="master-head-right"><div class="estimated-bill"><span class="estimated-bill-label">ESTIMATED GROCERY BILL</span><span class="estimated-bill-total" id="estimated-grocery-total">$0.00</span></div><button class="master-clear" id="master-clear">Clear all checks</button></div></div><ul class="master-list" id="master-list"></ul></section>';const showList=()=>{root.classList.add('list-view');doc.querySelector('#gr-show-list')?.classList.add('active');doc.querySelector('#gr-show-recipes')?.classList.remove('active');};const showRecipes=()=>{root.classList.remove('list-view');doc.querySelector('#gr-show-recipes')?.classList.add('active');doc.querySelector('#gr-show-list')?.classList.remove('active');};doc.querySelector('#gr-show-list').onclick=showList;doc.querySelector('#gr-show-recipes').onclick=showRecipes;const close=doc.querySelector('.gr-close');if(close&&!close.dataset.parentWired){close.dataset.parentWired='1';close.addEventListener('click',()=>doc.querySelector('#gr-dialog')?.close());}showList();}
      function renderRecipeData(doc){const grid=doc.querySelector('#gr-grid');if(!grid)return;grid.innerHTML=recipes.map(recipe=>'<article class="card"><div class="art"><span>'+esc(recipe.emoji||'🍽️')+'</span></div><div class="body"><div class="meta"><b>'+esc((recipe.type||'RECIPE').toUpperCase())+'</b><span>'+esc(recipe.time||'')+'</span></div><h3>'+esc(recipe.title)+'</h3><p class="desc">'+esc(recipe.description||'')+'</p><div class="actions"><button class="view" type="button">View recipe</button><button class="add" type="button">Add to list <span>+</span></button></div></div></article>').join('');}
      function showRecipeFromDatabase(doc,recipe){const dialog=doc.querySelector('#gr-dialog'),detail=doc.querySelector('#gr-detail');if(!dialog||!detail)return;detail.innerHTML=`<p class="gr-kicker">${esc(recipe.type).toUpperCase()} · ${esc(recipe.time)}</p><h2>${esc(recipe.title)}</h2><div class="gr-columns"><section><h4>INGREDIENTS</h4>${recipe.groups.map(group=>`<div class="gr-group"><b>${esc(group.name)}</b><ul>${group.ingredients.map(i=>`<li>${esc([i.quantity,i.ingredient_text].filter(Boolean).join(' '))}</li>`).join('')}</ul></div>`).join('')}</section><section><h4>ASSEMBLY INSTRUCTIONS</h4><ol>${recipe.steps.map(step=>`<li>${esc(step.instruction)}</li>`).join('')}</ol></section></div>`;dialog.showModal();}
      async function addRecipeToMaster(recipe){const ids=recipe.groups.flatMap(group=>group.ingredients).map(i=>i.grocery_item_id).filter(Boolean);await Promise.all([...new Set(ids)].map(id=>setChecked(id,true)));}
      function wireFrame(){const doc=frameDoc();if(!doc)return;ensureFrameStructure(doc);buildMasterList(doc);renderRecipeData(doc);const clearButton=doc.querySelector('#master-clear');if(clearButton&&!clearButton.dataset.supabaseWired){clearButton.dataset.supabaseWired='1';clearButton.addEventListener('click',clearChecks);}if(!doc.documentElement.dataset.supabaseFrameWired){doc.documentElement.dataset.supabaseFrameWired='1';doc.addEventListener('click',event=>{const viewButton=event.target.closest('.card .view');if(viewButton){const card=viewButton.closest('.card'),title=card?.querySelector('h3')?.textContent,recipe=recipeByTitle.get(title);if(recipe){event.preventDefault();event.stopImmediatePropagation();showRecipeFromDatabase(doc,recipe);}return;}const addButton=event.target.closest('.card .add');if(addButton){const card=addButton.closest('.card'),title=card?.querySelector('h3')?.textContent,recipe=recipeByTitle.get(title);if(recipe){event.preventDefault();event.stopImmediatePropagation();addRecipeToMaster(recipe).then(()=>{addButton.innerHTML='Added <span>✓</span>';setTimeout(()=>{addButton.innerHTML='Add to list <span>+</span>';},1300);});}}},true);}}
      async function syncApp(){await loadDatabase();wireFrame();}
      async function prepareApp(){if(appSyncPromise)return appSyncPromise;showLoading();appSyncPromise=(async()=>{try{await syncApp();appReady=true;hideAuth();}catch(error){console.error('Gather Supabase sync failed:',error);showAuth('Unable to load your Gather data. Please refresh and try again.');}finally{appSyncPromise=null;}})();return appSyncPromise;}
      app.addEventListener('load',()=>{if(session&&!appReady)prepareApp();});
      supabase.auth.onAuthStateChange((_event,newSession)=>{session=newSession;if(session){if(!appReady)prepareApp();}else{appReady=false;showAuth();}});
      (async()=>{const {data,error}=await supabase.auth.getSession();if(error){showAuth(error.message);return;}session=data.session;if(session)await prepareApp();else showAuth();})();
    })();
  </script>
</body>
</html>
