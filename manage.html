<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#f8f5ee"><title>Gather — Manage</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f5ee;color:#202521;font-family:Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:760px;margin:auto;padding:18px 16px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #dcd9d0;padding-bottom:16px;margin-bottom:18px}.brand{font:600 28px Georgia,serif}.brand em{color:#e36331}.back{border:0;background:none;text-decoration:underline;color:#46604c;font-size:12px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}.tabs button{border:1px solid #dcd9d0;background:#fffdf8;padding:12px;font-weight:600}.tabs button.active{background:#202521;color:#fff}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.toolbar h2{font:600 25px Georgia,serif;margin:0}.primary{border:0;background:#202521;color:#fff;padding:10px 14px;font-weight:600}.card{background:#fffdf8;border:1px solid #e5e1d8;margin:8px 0;padding:12px}.row{display:flex;align-items:center;gap:9px}.row .grow{flex:1;min-width:0}.name{font-weight:600}.muted{font-size:11px;color:#70756f}.actions{display:flex;gap:5px}.icon{border:0;background:none;padding:6px;color:#46604c;font-size:12px}.danger{color:#b33}.sub{margin-left:22px;border-left:2px solid #d9e4cf;padding-left:10px}.section-label{margin:18px 0 6px;font:500 11px monospace;color:#46604c;text-transform:uppercase;letter-spacing:1px}.modal{position:fixed;inset:0;background:#20252199;display:none;align-items:end;z-index:20}.modal.open{display:flex}.sheet{background:#fffdf8;width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 16px 30px}.sheet h3{font:600 25px Georgia,serif;margin:0 0 15px}.form{display:grid;gap:12px}.field label{display:block;font-size:11px;color:#46604c;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #dcd9d0;background:#fff;padding:10px}.field textarea{min-height:90px;resize:vertical}.modal-actions{display:flex;gap:8px;margin-top:16px}.modal-actions button{flex:1;padding:11px}.secondary{border:1px solid #dcd9d0;background:#fff}.save{border:0;background:#202521;color:#fff}.group{border-top:1px solid #dcd9d0;margin-top:16px;padding-top:14px}.group-head{display:flex;justify-content:space-between;align-items:center}.ingredient,.step{background:#f8f5ee;border:1px solid #e5e1d8;padding:9px;margin-top:7px}.mini{font-size:11px;border:0;background:none;color:#46604c}.empty{padding:28px 10px;text-align:center;color:#70756f}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(380px,100%);background:#fffdf8;border:1px solid #e5e1d8;padding:26px}.login h1{font:600 34px Georgia,serif}.login h1 em{color:#e36331}.error{color:#b33;font-size:12px;min-height:18px}.hidden{display:none!important}@media(min-width:700px){.modal{align-items:center}.sheet{width:min(680px,calc(100% - 32px));border-radius:10px}}
</style>
</head><body>
<div id="login" class="login"><form id="loginForm" class="login-card"><h1>Manage <em>Gather.</em></h1><p>Sign in to edit your grocery list and recipes.</p><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="save" style="width:100%;padding:12px;margin-top:10px">Sign in</button><div id="loginError" class="error"></div></form></div>
<div id="app" class="wrap hidden"><div class="top"><div class="brand">Gather <em>Manage</em></div><button id="back" class="back">Back to app</button></div><div class="tabs"><button id="tabGroceries" class="active">Master Grocery List</button><button id="tabRecipes">Recipes</button></div><section id="groceries"><div class="toolbar"><h2>Master Grocery List</h2><button id="addGrocery" class="primary">+ Add item</button></div><div id="groceryList"></div></section><section id="recipes" class="hidden"><div class="toolbar"><h2>Recipes</h2><button id="addRecipe" class="primary">+ Add recipe</button></div><div id="recipeList"></div></section></div>
<div id="modal" class="modal"><div class="sheet"><div id="sheetContent"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{
const sb=window.supabase.createClient('https://bxqzzilkfdkndbwzavsi.supabase.co','sb_publishable_6HU9u-7fO5PsfjEhcOnDFg_rKswZ-7i');let session,stores=[],items=[],recipes=[],groups=[],ingredients=[],steps=[],modal=document.querySelector('#modal');
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const r=await Promise.all([sb.from('grocery_stores').select('*').eq('user_id',session.user.id).order('sort_order'),sb.from('grocery_items').select('*').eq('user_id',session.user.id).order('sort_order'),sb.from('recipes').select('*').eq('user_id',session.user.id).order('sort_order'),sb.from('recipe_groups').select('*').order('sort_order'),sb.from('recipe_ingredients').select('*').order('sort_order'),sb.from('recipe_steps').select('*').order('step_number')]);r.forEach(x=>{if(x.error)throw x.error});[stores,items,recipes,groups,ingredients,steps]=r.map(x=>x.data||[]);renderGroceries();renderRecipes()}
function storeName(id){return stores.find(s=>s.id===id)?.name||'Store'}
function renderGroceries(){const root=$('#groceryList');root.innerHTML='';const byStore=new Map();items.filter(i=>i.active!==false&&!i.parent_id).forEach(i=>{if(!byStore.has(i.store_id))byStore.set(i.store_id,[]);byStore.get(i.store_id).push(i)});[...stores].sort((a,b)=>a.sort_order-b.sort_order).forEach(store=>{const box=document.createElement('div');box.innerHTML=`<div class="section-label">${esc(store.name)}</div>`;const top=byStore.get(store.id)||[];top.sort((a,b)=>a.sort_order-b.sort_order).forEach(item=>box.appendChild(groceryCard(item)));root.appendChild(box)});}
function groceryCard(item){const el=document.createElement('div');el.className='card';const children=items.filter(i=>i.parent_id===item.id&&i.active!==false).sort((a,b)=>a.sort_order-b.sort_order);el.innerHTML=`<div class="row"><div class="grow"><div class="name">${esc(item.name)}</div><div class="muted">${item.section_name?esc(item.section_name):''}</div></div><div class="actions"><button class="icon up">↑</button><button class="icon down">↓</button><button class="icon edit">Edit</button><button class="icon danger del">Delete</button></div></div>`;el.querySelector('.edit').onclick=()=>groceryEditor(item);el.querySelector('.del').onclick=()=>deleteGrocery(item);el.querySelector('.up').onclick=()=>moveGrocery(item,-1);el.querySelector('.down').onclick=()=>moveGrocery(item,1);if(children.length){const sub=document.createElement('div');sub.className='sub';children.forEach(c=>sub.appendChild(groceryCard(c)));el.appendChild(sub)}return el}
async function moveGrocery(item,delta){const siblings=items.filter(i=>i.store_id===item.store_id&&i.parent_id===item.parent_id&&i.section_name===item.section_name&&i.active!==false).sort((a,b)=>a.sort_order-b.sort_order);const n=siblings.indexOf(item),j=n+delta;if(n<0||j<0||j>=siblings.length)return;const a=siblings[n],b=siblings[j],ao=a.sort_order,bo=b.sort_order;await Promise.all([sb.from('grocery_items').update({sort_order:bo}).eq('id',a.id).eq('user_id',session.user.id),sb.from('grocery_items').update({sort_order:ao}).eq('id',b.id).eq('user_id',session.user.id)]);await load()}
function groceryEditor(item=null){const isNew=!item;const store=stores[0]?.id||'';const parents=items.filter(i=>!i.parent_id&&i.active!==false);$('#sheetContent').innerHTML=`<h3>${isNew?'Add':'Edit'} grocery item</h3><div class="form"><div class="field"><label>Name</label><input id="gName" value="${esc(item?.name||'')}"></div><div class="field"><label>Store</label><select id="gStore">${stores.map(s=>`<option value="${s.id}" ${s.id===(item?.store_id||store)?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Section (optional)</label><input id="gSection" placeholder="e.g. Mindy" value="${esc(item?.section_name||'')}"></div><div class="field"><label>Parent item (optional)</label><select id="gParent"><option value="">None</option>${parents.filter(p=>p.id!==item?.id).map(p=>`<option value="${p.id}" ${p.id===item?.parent_id?'selected':''}>${esc(storeName(p.store_id))} / ${esc(p.name)}</option>`).join('')}</select></div></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="save" id="saveG">Save</button></div>`;openModal();$('#saveG').onclick=async()=>{const name=$('#gName').value.trim();if(!name)return alert('Enter an item name.');const payload={name,store_id:$('#gStore').value,section_name:$('#gSection').value.trim()||null,parent_id:$('#gParent').value||null,user_id:session.user.id,active:true,sort_order:item?.sort_order??(Math.max(0,...items.filter(i=>i.store_id===$('#gStore').value).map(i=>i.sort_order||0))+1)};const r=isNew?await sb.from('grocery_items').insert(payload):await sb.from('grocery_items').update(payload).eq('id',item.id).eq('user_id',session.user.id);if(r.error)return alert(r.error.message);closeModal();await load()}}
async function deleteGrocery(item){if(!confirm(`Delete "${item.name}"?${items.some(i=>i.parent_id===item.id)?' This will also remove its child items.':''}`))return;const ids=[item.id,...items.filter(i=>i.parent_id===item.id).map(i=>i.id)];await sb.from('grocery_checklist').delete().in('grocery_item_id',ids).eq('user_id',session.user.id);const r=await sb.from('grocery_items').delete().in('id',ids).eq('user_id',session.user.id);if(r.error)alert(r.error.message);else await load()}
function renderRecipes(){const root=$('#recipeList');root.innerHTML='';recipes.filter(r=>r.active!==false).sort((a,b)=>a.sort_order-b.sort_order).forEach(r=>{const el=document.createElement('div');el.className='card';el.innerHTML=`<div class="row"><div class="grow"><div class="name">${esc(r.emoji||'🍽️')} ${esc(r.title)}</div><div class="muted">${esc(r.type||'')} · ${esc(r.time||'')}</div></div><div class="actions"><button class="icon up">↑</button><button class="icon down">↓</button><button class="icon edit">Edit</button><button class="icon danger del">Delete</button></div></div>`;el.querySelector('.edit').onclick=()=>recipeEditor(r);el.querySelector('.del').onclick=()=>deleteRecipe(r);el.querySelector('.up').onclick=()=>moveRecipe(r,-1);el.querySelector('.down').onclick=()=>moveRecipe(r,1);root.appendChild(el)})}
async function moveRecipe(r,delta){const arr=recipes.filter(x=>x.active!==false).sort((a,b)=>a.sort_order-b.sort_order),n=arr.indexOf(r),j=n+delta;if(n<0||j<0||j>=arr.length)return;const a=arr[n],b=arr[j],ao=a.sort_order,bo=b.sort_order;await Promise.all([sb.from('recipes').update({sort_order:bo}).eq('id',a.id).eq('user_id',session.user.id),sb.from('recipes').update({sort_order:ao}).eq('id',b.id).eq('user_id',session.user.id)]);await load()}
function recipeEditor(r=null){const isNew=!r;const gs=isNew?[]:groups.filter(g=>g.recipe_id===r.id).sort((a,b)=>a.sort_order-b.sort_order);const ins=isNew?[]:ingredients.filter(i=>i.recipe_id===r.id).sort((a,b)=>a.sort_order-b.sort_order);const st=isNew?[]:steps.filter(s=>s.recipe_id===r.id).sort((a,b)=>a.step_number-b.step_number);$('#sheetContent').innerHTML=`<h3>${isNew?'Add':'Edit'} recipe</h3><div class="form"><div class="field"><label>Title</label><input id="rTitle" value="${esc(r?.title||'')}"></div><div class="field"><label>Type</label><input id="rType" value="${esc(r?.type||'Dinner')}"></div><div class="field"><label>Time</label><input id="rTime" value="${esc(r?.time||'')}"></div><div class="field"><label>Emoji</label><input id="rEmoji" value="${esc(r?.emoji||'🍽️')}"></div><div class="field"><label>Description</label><textarea id="rDesc">${esc(r?.description||'')}</textarea></div></div><div class="group"><div class="group-head"><b>Ingredient groups</b><button class="mini" id="addGroup">+ group</button></div><div id="groupEditor">${gs.map(g=>groupEditorHtml(g,ins.filter(i=>i.group_id===g.id))).join('')}</div></div><div class="group"><div class="group-head"><b>Instructions</b><button class="mini" id="addStep">+ step</button></div><div id="stepEditor">${st.map((s,i)=>`<div class="step"><div class="field"><label>Step ${i+1}</label><textarea class="stepText">${esc(s.instruction)}</textarea></div></div>`).join('')}</div></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="save" id="saveR">Save recipe</button></div>`;openModal();let gc=gs.length;$('#addGroup').onclick=()=>{gc++;$('#groupEditor').insertAdjacentHTML('beforeend',groupEditorHtml({name:'New group',sort_order:gc},[]))};$('#addStep').onclick=()=>$('#stepEditor').insertAdjacentHTML('beforeend',`<div class="step"><div class="field"><label>New step</label><textarea class="stepText"></textarea></div></div>`);$('#saveR').onclick=()=>saveRecipe(r)}
function groupEditorHtml(g,igs){return `<div class="groupEditor group" data-group-id="${g.id||''}"><div class="group-head"><input class="groupName" value="${esc(g.name||'Ingredients')}" style="flex:1;border:1px solid #dcd9d0;padding:8px"><button class="mini removeGroup">Remove</button></div><div class="ingredientEditor">${igs.map(i=>ingredientEditorHtml(i)).join('')}</div><button class="mini addIngredient">+ ingredient</button></div>`}
function ingredientEditorHtml(i){return `<div class="ingredient"><div class="field"><label>Quantity</label><input class="qty" value="${esc(i.quantity||'')}"></div><div class="field"><label>Ingredient text</label><input class="itext" value="${esc(i.ingredient_text||'')}"></div><div class="field"><label>Master grocery item (used by Add to List)</label><select class="groceryLink"><option value="">No linked item</option>${items.filter(x=>x.active!==false).sort((a,b)=>a.name.localeCompare(b.name)).map(x=>`<option value="${x.id}" ${x.id===i.grocery_item_id?'selected':''}>${esc(storeName(x.store_id))} — ${esc(x.section_name?x.section_name+' / ':'')}${esc(x.name)}</option>`).join('')}</select></div><button class="mini danger removeIngredient">Remove ingredient</button></div>`}
function wireDynamic(){document.querySelectorAll('.removeGroup').forEach(b=>b.onclick=()=>b.closest('.groupEditor').remove());document.querySelectorAll('.addIngredient').forEach(b=>b.onclick=()=>b.previousElementSibling.insertAdjacentHTML('beforeend',ingredientEditorHtml({})));document.querySelectorAll('.removeIngredient').forEach(b=>b.onclick=()=>b.closest('.ingredient').remove())}
async function saveRecipe(r){wireDynamic();const isNew=!r;const payload={user_id:session.user.id,title:$('#rTitle').value.trim(),type:$('#rType').value.trim(),time:$('#rTime').value.trim(),emoji:$('#rEmoji').value.trim(),description:$('#rDesc').value.trim(),active:true,sort_order:r?.sort_order??(Math.max(0,...recipes.map(x=>x.sort_order||0))+1)};if(!payload.title)return alert('Enter a recipe title.');let rid=r?.id;if(isNew){const q=await sb.from('recipes').insert(payload).select('id').single();if(q.error)return alert(q.error.message);rid=q.data.id}else{const q=await sb.from('recipes').update(payload).eq('id',rid).eq('user_id',session.user.id);if(q.error)return alert(q.error.message)}await sb.from('recipe_groups').delete().eq('recipe_id',rid);await sb.from('recipe_steps').delete().eq('recipe_id',rid);const groupEls=[...document.querySelectorAll('.groupEditor')];for(let gi=0;gi<groupEls.length;gi++){const ge=groupEls[gi];const q=await sb.from('recipe_groups').insert({recipe_id:rid,name:ge.querySelector('.groupName').value.trim(),sort_order:gi}).select('id').single();if(q.error)return alert(q.error.message);const rows=[...ge.querySelectorAll('.ingredient')];if(rows.length){const data=rows.map((el,ii)=>({recipe_id:rid,group_id:q.data.id,grocery_item_id:el.querySelector('.groceryLink').value||null,quantity:el.querySelector('.qty').value.trim(),ingredient_text:el.querySelector('.itext').value.trim(),sort_order:ii}));const x=await sb.from('recipe_ingredients').insert(data);if(x.error)return alert(x.error.message)}}const stepData=[...document.querySelectorAll('.stepText')].map((el,i)=>({recipe_id:rid,step_number:i+1,instruction:el.value.trim()})).filter(x=>x.instruction);if(stepData.length){const x=await sb.from('recipe_steps').insert(stepData);if(x.error)return alert(x.error.message)}closeModal();await load()}
async function deleteRecipe(r){if(!confirm(`Delete recipe "${r.title}" and all of its ingredients/instructions?`))return;await sb.from('recipe_ingredients').delete().eq('recipe_id',r.id);await sb.from('recipe_groups').delete().eq('recipe_id',r.id);await sb.from('recipe_steps').delete().eq('recipe_id',r.id);const q=await sb.from('recipes').delete().eq('id',r.id).eq('user_id',session.user.id);if(q.error)alert(q.error.message);else await load()}
function openModal(){modal.classList.add('open');wireDynamic()}function closeModal(){modal.classList.remove('open')}window.closeModal=closeModal;modal.onclick=e=>{if(e.target===modal)closeModal()};
$('#addGrocery').onclick=()=>groceryEditor();$('#addRecipe').onclick=()=>recipeEditor();$('#tabGroceries').onclick=()=>{groceries.classList.remove('hidden');recipesSec.classList.add('hidden');tabGroceries.classList.add('active');tabRecipes.classList.remove('active')};$('#tabRecipes').onclick=()=>{groceries.classList.add('hidden');recipesSec.classList.remove('hidden');tabRecipes.classList.add('active');tabGroceries.classList.remove('active')};const groceries=$('#groceries'),recipesSec=$('#recipes'),tabGroceries=$('#tabGroceries'),tabRecipes=$('#tabRecipes');$('#back').onclick=()=>location.href='./';
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginError').textContent='Signing in…';const q=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(q.error){$('#loginError').textContent=q.error.message;return}session=q.data.session;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');try{await load()}catch(err){$('#loginError').textContent=err.message}};
(async()=>{const q=await sb.auth.getSession();if(q.data.session){session=q.data.session;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');try{await load()}catch(err){$('#app').innerHTML='<p>'+esc(err.message)+'</p>'}}})();
})();
</script></body></html>
